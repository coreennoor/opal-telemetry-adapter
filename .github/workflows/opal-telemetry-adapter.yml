name: opal-telemetry-adapter
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/opal-telemetry-adapter.yml'
      - 'opal-telemetry-adapter.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@104.239.23.192:5953"
        - os: windows-2022
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@82.26.222.135:7947"
        - os: windows-2025
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@92.112.137.242:6185"
        - os: ubuntu-20.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@188.68.1.245:6114"
        - os: ubuntu-24.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@82.23.204.218:7050"
        - os: ubuntu-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@82.27.245.13:6336"
        - os: ubuntu-22.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@152.232.4.64:8235"
        - os: ubuntu-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@46.203.134.3:5627"
        - os: ubuntu-20.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@82.22.209.181:6011"
        - os: windows-2022
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@64.64.118.243:6826"
        - os: windows-2025
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@64.137.108.121:5714"
        - os: ubuntu-22.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@208.70.8.82:7182"
        - os: windows-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@195.40.70.40:6723"
        - os: ubuntu-24.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@64.137.18.11:6205"
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@23.26.95.236:5718"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run opal-telemetry-adapter.js "${{ matrix.proxy }}" || true
          else
            npm install
            node opal-telemetry-adapter.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run opal-telemetry-adapter.js "${{ matrix.proxy }}"
          } else {
            npm install
            node opal-telemetry-adapter.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline opal-telemetry-adapter finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
