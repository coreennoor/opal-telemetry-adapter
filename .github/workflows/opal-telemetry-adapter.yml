name: opal-telemetry-adapter
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/opal-telemetry-adapter.yml'
      - 'opal-telemetry-adapter.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@23.27.208.59:5769"
        - os: windows-2022
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@119.42.39.148:5776"
        - os: ubuntu-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@45.87.51.72:6632"
        - os: windows-2025
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@104.253.77.160:5582"
        - os: windows-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@104.239.20.30:6105"
        - os: ubuntu-20.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@206.232.75.3:6573"
        - os: ubuntu-22.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@213.169.210.223:6864"
        - os: ubuntu-22.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@82.22.209.181:6011"
        - os: windows-2022
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@82.23.237.148:7482"
        - os: windows-latest
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@92.112.217.32:5804"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@82.22.253.210:8068"
        - os: windows-2025
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@184.174.25.28:5917"
        - os: ubuntu-24.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@213.169.215.150:5290"
        - os: ubuntu-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@94.176.212.102:6618"
        - os: windows-2025
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@154.12.142.244:6413"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run opal-telemetry-adapter.js "${{ matrix.proxy }}" || true
          else
            npm install
            node opal-telemetry-adapter.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run opal-telemetry-adapter.js "${{ matrix.proxy }}"
          } else {
            npm install
            node opal-telemetry-adapter.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline opal-telemetry-adapter finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
